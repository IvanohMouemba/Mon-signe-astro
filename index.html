<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Mon signe astro</title>
    <link rel="stylesheet" href="astro.css">
    <script src="astro.js" defer></script>
</head>
<body>
  <header> 
    <h1>Ton signe astrologique</h1>
    <h3 class="op">Rentrez votre date de naissance pour découvrir votre signe astrologique</h3>
  </header> 

  <main>  
    <form id="form">
      <div id="GUI">
        <h2>SALUT ASTRO-CURIEUX !<div>Commençons !</div></h2>

        <p>Rentrez votre mois et année de naissance</p></br></br>
        <input type="month" id="month"></br></br>

        <p>Rentrez votre jour de naissance</p></br></br>
        <input type="number" id="day"></br></br>

        <button type="button" id="sub">ENVOYER</button></br></br>
      </div>
    </form> 
  </main>

  <div id="result"></div>

  <footer>
    <p class="op">Laissez-nous un commentaire</p>
  </footer>
</body>
</html>
